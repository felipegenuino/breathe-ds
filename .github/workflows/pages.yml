# Publishes the playground to GitHub Pages (https://felipegenuino.github.io/breathe-ds/)
# on every push to main that touches the playground or the components.
name: Playground on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["playground/**", "components/**", "tokens/**", "theme.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      - run: npx vite build
        working-directory: playground
        env:
          BASE: /breathe-ds/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
