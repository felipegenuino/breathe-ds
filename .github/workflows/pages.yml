# Publishes the playground to GitHub Pages (https://felipegenuino.github.io/breathe-ds/)
# on every push to main that touches the playground or the components.
name: Playground on GitHub Pages

on:
  push:
    branches: [main]
    paths: ["playground/**", "components/**", "tokens/**", "theme.css", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm ci
        working-directory: playground
      # demo media is kept out of git on purpose (see .gitignore); it lives as an
      # asset of the demo-media-1 release and is unpacked here before the build
      - run: gh release download demo-media-1 -p breathe-demo-media.zip -D /tmp && unzip -o /tmp/breathe-demo-media.zip -d playground/public/demo
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx vite build
        working-directory: playground
        env:
          BASE: /breathe-ds/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
